{% extends 'base.html' %}
{% load static %}

{% block title %}User Settings{% endblock %}

{% block extra_css %}
  <!-- favicon -->
  <link rel="icon" href="{% static 'assets/img/main.png' %}" sizes="400x400" type="image/png">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Ubuntu+Condensed" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="container-fluid py-4">

  <!-- Page Header -->
  <h2 class="text-center mb-4">User Settings</h2>

  <form method="post" class="mb-5">
    {% csrf_token %}

    <!-- Hide Other Users Results -->
    <div class="form-row mb-3">
      <div class="col-md-6">
        <label>Hide other users' results</label>
        <select name="hide_othersresult" class="form-control">
          <option value="True" {% if settings.hide_othersresult %}selected{% endif %}>Yes</option>
          <option value="False" {% if not settings.hide_othersresult %}selected{% endif %}>No</option>
        </select>
      </div>
    </div>

    <!-- QC Names -->
    <div class="form-row mb-3">
      <div class="col-md-3">
        <label>QC 1 Name</label>
        <input name="qc_1_name" class="form-control" value="{{ settings.qc_1_name }}">
      </div>
      <div class="col-md-3">
        <label>QC 2 Name</label>
        <input name="qc_2_name" class="form-control" value="{{ settings.qc_2_name }}">
      </div>
      <div class="col-md-3">
        <label>QC 3 Name</label>
        <input name="qc_3_name" class="form-control" value="{{ settings.qc_3_name }}">
      </div>
      <div class="col-md-3">
        <label>QC 4 Name</label>
        <input name="qc_4_name" class="form-control" value="{{ settings.qc_4_name }}">
      </div>
    </div>

    <!-- Automatic Settings -->
    <div class="form-row mb-3">
      <div class="col-md-6">
        <label>Automatic QC Setting</label>
        <select name="qc_selector" class="form-control">
          {% for key,value in qc_settings.items %}
            <option value="{{ key }}" {% if settings.QC_tool == key %}selected{% endif %}>{{ value }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label>Automatic Workflow Settings</label>
        <select name="workflow_selector" class="form-control" multiple>
          {% for key,value in qc_settings.items %}
            <option value="{{ key }}" {% if key in settings.workflow_tool %}selected{% endif %}>{{ value }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <!-- Conversion Options -->
    <div class="form-row mb-4">
      <div class="col-md-6">
        <label><strong>Replace raw with mzML</strong></label>
        <select name="replace_raw_with_mzML" class="form-control">
          <option value="True" {% if settings.replace_raw_with_mzML %}selected{% endif %}>Yes</option>
          <option value="False" {% if not settings.replace_raw_with_mzML %}selected{% endif %}>No</option>
        </select>
      </div>
      <div class="col-md-6">
        <label><strong>Enable extraction info</strong></label>
        <select name="perform_extraction" class="form-control">
          <option value="True" {% if settings.perform_extraction %}selected{% endif %}>Yes</option>
          <option value="False" {% if not settings.perform_extraction %}selected{% endif %}>No</option>
        </select>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="form-row">
      <div class="col-md-6 mb-3">
        <button type="submit" name="save_settings" class="btn btn-primary">Save</button>
      </div>
      <div class="col-md-6 mb-3 text-right">
        <a href="{% url 'system_settings' %}" class="btn btn-secondary">Advance System Settings</a>
      </div>
    </div>

  </form>

</div>
{% endblock %}

{% block extra_js %}{% endblock %}
